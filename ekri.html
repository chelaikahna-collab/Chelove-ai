<!DOCTYPE html>
<html lang="ht">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ekri Feyton - Chelove AI</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#fff8f9] p-4">
<div class="max-w-2xl mx-auto">
<a href="/" class="text-pink-600 font-bold">← Retounen</a>
<h1 class="text-2xl font-bold mt-4">Ekri Nouvo Feyton ✍️</h1>
<p class="text-sm text-gray-500">Ekri istwa pa ou, fè lektè yo renmen ou</p>

<div class="bg-white p-4 rounded-2xl border mt-6 space-y-4">
<input id="tit" placeholder="Tit feyton an... Ex: Lanmou Anba Lapli" class="w-full border p-3 rounded-xl">
<input id="ote" placeholder="Non ou... Ex: Mousta" class="w-full border p-3 rounded-xl">
<textarea id="istwa" rows="10" placeholder="Ekri istwa ou isit la... Chapit 1: Li te yon jou lapli..." class="w-full border p-3 rounded-xl"></textarea>
<input id="moncash" placeholder="Nimewo MonCash ou pou touche (509...)" class="w-full border p-3 rounded-xl bg-pink-50">

<button onclick="pibliye()" class="w-full bg-pink-600 text-white p-4 rounded-xl font-bold">Pibliye Feyton An 🚀</button>
</div>
</div>

<script>
function pibliye(){
 let t=document.getElementById('tit').value;
 let o=document.getElementById('ote').value;
 let i=document.getElementById('istwa').value;
 if(!t || !i){ alert('Ekri tit ak istwa a!'); return; }
 let feytons = JSON.parse(localStorage.getItem('chelove_feytons') || '[]');
 feytons.unshift({tit:t, ote:o||'Anonyme', istwa:i, lekti: Math.floor(Math.random()*1000), date: new Date().toLocaleDateString()});
 localStorage.setItem('chelove_feytons', JSON.stringify(feytons));
 alert('Feyton ou pibliye! ✅');
 window.location.href='/';
}
</script>
</body>
</html>
