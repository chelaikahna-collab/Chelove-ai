<!DOCTYPE html>
<html><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Chelove AI</title>
<script src="https://cdn.tailwindcss.com"></script>
</head><body class="bg-pink-50">
<header class="bg-white p-4 flex justify-between border-b">
<b class="text-pink-600">Chelove AI</b>
<button id="btn" class="bg-pink-600 text-white px-4 py-2 rounded-full">+ Ekri</button>
</header>
<div id="form" class="hidden bg-white p-4">
<input id="tit" placeholder="Tit feyton" class="w-full border p-2 rounded mt-2">
<textarea id="txt" placeholder="Ekri istwa w..." class="w-full border p-2 rounded mt-2 h-24"></textarea>
<button id="pub" class="bg-pink-600 text-white w-full p-2 rounded mt-2">Pibliye</button>
</div>
<main class="p-4"><div id="lis"></div></main>
<script>
let b=document.getElementById('btn'),f=document.getElementById('form'),l=document.getElementById('lis');
b.onclick=()=>f.classList.toggle('hidden');
pub.onclick=()=>{
let t=tit.value,s=txt.value;if(!t||!s)return alert('Mete tit!');
let d=JSON.parse(localStorage.getItem('f')||'[]');d.unshift({t,s});
localStorage.setItem('f',JSON.stringify(d));tit.value='';txt.value='';f.classList.add('hidden');show();
};
function show(){let d=JSON.parse(localStorage.getItem('f')||'[]');
l.innerHTML=d.length?d.map(x=>`<div class="bg-white p-3 rounded border mb-2"><b>${x.t}</b><p class="mt-1">${x.s}</p></div>`).join(''):'<p class="text-center text-gray-400 mt-10">Poko gen feyton. Peze + Ekri!</p>';}
show();
</script>
</body></html>
