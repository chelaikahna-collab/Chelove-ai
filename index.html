<!DOCTYPE html><html lang="ht"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Chelove AI</title><script src="https://cdn.tailwindcss.com"></script></head><body class="bg-[#fff8f9]"><header class="bg-white p-4 flex justify-between border-b sticky top-0"><b class="text-pink-600 text-xl">Chelove AI</b><button onclick="document.getElementById('ekri').classList.toggle('hidden')" class="bg-pink-600 text-white px-4 py-2 rounded-full text-sm font-bold">+ Ekri</button></header><div id="ekri" class="hidden bg-white p-4 border-b"><h2 class="font-bold">Ekri Feyton ✍️</h2><input id="tit" placeholder="Tit feyton" class="w-full border p-3 rounded-xl mt-2"><input id="ote" placeholder="Non ou" class="w-full border p-3 rounded-xl mt-2"><textarea id="istwa" rows="4" placeholder="Istwa..." class="w-full border p-3 rounded-xl mt-2"></textarea><input id="mc" placeholder="MonCash 509..." class="w-full border p-3 rounded-xl mt-2 bg-pink-50"><button onclick="pibliye()" class="w-full bg-pink-600 text-white p-3 rounded-xl font-bold mt-2">Pibliye 🚀</button></div><main class="p-4 max-w-3xl mx-auto"><div class="bg-gradient-to-r from-pink-600 to-yellow-500 text-white p-6 rounded-3xl"><h1 class="text-2xl font-bold">Byenveni sou Chelove AI</h1><p class="text-sm mt-2">Li, Ekri, Fè kob MonCash</p></div><h2 class="font-bold mt-6 mb-3">Feyton Popile 🔥</h2><div id="lis" class="grid gap-3"></div></main><script>function pibliye(){let t=tit.value,o=ote.value,s=istwa.value;if(!t||!s){alert('Ekri tit ak istwa');return;}let f=JSON.parse(localStorage.getItem('chelove_feytons')||'[]');f.unshift({tit:t,ote:o||'Anonyme',istwa:s,lekti:Math.floor(Math.random()*500)});localStorage.setItem('chelove_feytons',JSON.stringify(f));alert('Pibliye!');location.reload();}let def=[{tit:"Paran Konsa Yo Mwen Pa Vle Yo",ote:"Mousta",istwa:"Istwa jenn fi ki refize...",lekti:12500},{tit:"Lanmou Anba Lapli",ote:"Chelove",istwa:"De jenn rankontre...",lekti:8200}];let saved=JSON.parse(localStorage.getItem('chelove_feytons')||'[]');let tout=[...saved,...def];lis.innerHTML=tout.map((f,i)=>`<div class="bg-white p-4 rounded-2xl border flex gap-3"><div class="w-12 h-12 bg-pink-500 rounded-xl flex items-center justify-center text-white font-bold"> ${f.tit[0]}</div><div><h3 class="font-bold">${f.tit}</h3><p class="text-xs text-gray-500">pa ${f.ote} • ${f.lekti} lekti</p><p class="text-xs mt-1">${f.istwa.substring(0,70)}...</p></div></div>`).join('');</script></body></html>`
