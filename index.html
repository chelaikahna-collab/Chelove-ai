<!DOCTYPE html>
<html lang="ht">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chelove AI</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#fff8f9]">
<header class="bg-white p-4 flex justify-between items-center border-b">
<div class="flex items-center gap-2">
<div class="w-8 h-8 rounded-full bg-pink-600 flex items-center justify-center text-white font-bold">C</div>
<b class="text-pink-600">Chelove AI</b>
</div>
<button id="btnEkri" class="bg-pink-600 text-white px-5 py-2 rounded-full font-bold">+ Ekri</button>
</header>

<div id="ekri" class="hidden bg-white p-5 border-b">
<h2 class="font-bold">Ekri Feyton ✍️</h2>
<input id="tit" placeholder="Tit feyton an" class="w-full border p-3 rounded-xl mt-3">
<input id="ote" placeholder="Non otè" class="w-full border p-3 rounded-xl mt-3">
<textarea id="istwa" placeholder="Ekri istwa w..." class="w-full border p-3 rounded-xl mt-3 h-32"></textarea>
<button id="btnPibliye" class="bg-pink-600 text-white w-full p-3 rounded-xl mt-3 font-bold">Pibliye</button>
</div>

<main class="p-4 max-w-3xl mx-auto">
<div class="bg-gradient-to-r from-pink-600 to-yellow-500 text-white p-6 rounded-2xl">
<h1 class="text-2xl font-bold">Byenveni sou Chelove AI</h1>
<p>Li ak ekri pi bèl feyton kreyòl yo</p>
</div>
<h2 class="font-bold text-xl mt-6">📚 Feyton Popilè</h2>
<div id="lis" class="mt-4 space-y-3"></div>
</main>

<script>
let btnEkri=document.getElementById('btnEkri');
let ekri=document.getElementById('ekri');
let lis=document.getElementById('lis');
btnEkri.onclick=()=>ekri.classList.toggle('hidden');
document.getElementById('btnPibliye').onclick=()=>{
let t=document.getElementById('tit').value;
let o=document.getElementById('ote').value;
let i=document.getElementById('istwa').value;
if(!t||!i){alert('Mete tit ak istwa!');return}
let f=JSON.parse(localStorage.getItem('feyton')||'[]');
f.unshift({t,o,i,d:new Date().toLocaleDateString()});
localStorage.setItem('feyton',JSON.stringify(f));
document.getElementById('tit').value='';
document.getElementById('ote').value='';
document.getElementById('istwa').value='';
ekri.classList.add('hidden');
render();
};
function render(){
let f=JSON.parse(localStorage.getItem('feyton')||'[]');
if(f.length==0){
lis.innerHTML='<p class="text-gray-400 text-center mt-10">Poko gen feyton. Peze + Ekri!</p>';
return}
lis.innerHTML=f.map(x=>`<div class="bg-white p-4 rounded-xl border"><b class="text-pink-600">${x.t}</b><p class="text-xs text-gray-500">pa ${x.o||'Anonim'} - ${x.d}</p><p class="mt-2 text-sm">${x.i.substring(0,120)}...</p></div>`).join('');
}
render();
</script>
</body>
</html>
