<!DOCTYPE html>
<html lang="ht">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chelove AI</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#fff8f9]">
<header class="bg-white p-4 flex justify-between items-center border-b sticky top-0 z-10">
<div class="flex items-center gap-2"><div class="w-8 h-8 rounded-full bg-gradient-to-br from-pink-600 to-yellow-400 flex items-center justify-center text-white font-bold">C</div><b class="text-pink-600 text-xl">Chelove AI</b></div>
<button id="btnEkri" class="bg-pink-600 text-white px-5 py-2 rounded-full text-sm font-bold">+ Ekri</button>
</header>

<div id="ekri" class="hidden bg-white p-5 border-b">
<h2 class="font-bold text-lg">Ekri Feyton ✍️</h2>
<input id="tit" placeholder="Tit feyton an" class="w-full border p-3 rounded-xl mt-3">
<input id="ote" placeholder="Non ou (ex: Mousta)" class="w-full border p-3 rounded-xl mt-2">
<textarea id="istwa" rows="5" placeholder="Ekri istwa ou la..." class="w-full border p-3 rounded-xl mt-2"></textarea>
<input id="mc" placeholder="Nimewo MonCash ou 509..." class="w-full border p-3 rounded-xl mt-2 bg-pink-50">
<button id="btnPibliye" class="w-full bg-pink-600 text-white p-3 rounded-xl font-bold mt-3">Pibliye 🚀</button>
</div>

<main class="p-4 max-w-3xl mx-auto">
<div class="bg-gradient-to-r from-pink-600 via-orange-500 to-yellow-400 text-white p-6 rounded-3xl">
<h1 class="text-2xl font-bold">Byenveni sou Chelove AI</h1>
<p class="text-sm mt-2 opacity-90">Premye platfom kreyol kote ou ka li feyton, ekri pa ou, fe kob ak MonCash/NatCash.</p>
</div>
<h2 class="font-bold mt-6 mb-3 text-lg">Feyton Popile 🔥</h2>
<div id="lis" class="grid gap-3"></div>
</main>

<script>
document.getElementById('btnEkri').onclick = function(){
 document.getElementById('ekri').classList.toggle('hidden');
}
document.getElementById('btnPibliye').onclick = function(){
 let t=document.getElementById('tit').value;
 let o=document.getElementById('ote').value;
 let s=document.getElementById('istwa').value;
 if(!t||!s){alert('Ekri tit ak istwa!');return;}
 let f=JSON.parse(localStorage.getItem('chelove_feytons')||'[]');
 f.unshift({tit:t,ote:o||'Anonyme',istwa:s,lekti:Math.floor(Math.random()*900)+100});
 localStorage.setItem('chelove_feytons',JSON.stringify(f));
 alert('Feyton pibliye! 🎉');
 location.reload();
}
let def=[
{tit:"Paran Konsa Yo Mwen Pa Vle Yo",ote:"Mousta",istwa:"Se istwa yon jenn fi ki ap goumen pou lanmou li...",lekti:12500},
{tit:"Lanmou Anba Lapli",ote:"Chelove",istwa:"De jen ki rankontre anba lapli Port-au-Prince...",lekti:8200},
{tit:"Sekre Fanmi An",ote:"Anonyme",istwa:"Yon sekre ki kache depi 20 an pral eklate...",lekti:5400}
];
let saved=JSON.parse(localStorage.getItem('chelove_feytons')||'[]');
let tout=[...saved,...def];
document.getElementById('lis').innerHTML=tout.map(f=>`
<div class="bg-white p-4 rounded-2xl border flex gap-3 shadow-sm">
<div class="w-12 h-12 bg-pink-500 rounded-xl flex items-center justify-center text-white font-bold flex-shrink-0">${f.tit[0]}</div>
<div><h3 class="font-bold">${f.tit}</h3><p class="text-xs text-gray-500">pa ${f.ote} • ${f.lekti} lekti</p><p class="text-xs mt-1 text-gray-700">${f.istwa.substring(0,90)}...</p></div>
</div>`).join('');
</script>
</body>
</html>
